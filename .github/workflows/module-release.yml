name: Release SwissTechKnife module

# A new module version on main publishes module-v<version> with the package <id>-<version>.zip. The SwissTechKnife
# catalog sync picks the release up on its own (docs/MODULES.md in the host repository); notes for the catalog
# come from the "releaseNotes" entry for that version in module.json.
on:
  push:
    branches: [main]
    paths: ['src/SmoothMice.Module/module.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build package
        shell: pwsh
        run: ./scripts/pack-module.ps1 -Configuration Release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'src/SmoothMice.Module/module.json' -Raw | ConvertFrom-Json
          $version = $manifest.version
          $tag = "module-v$version"
          $zip = "artifacts/module/$($manifest.id)-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "$zip was not produced." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "| Package | sha256 | size |`n|---|---|---|`n| ``$(Split-Path -Leaf $zip)`` | ``$hash`` | $((Get-Item $zip).Length) |" | Add-Content $env:GITHUB_STEP_SUMMARY
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; nothing to publish."; exit 0 }
          $own = @($manifest.releaseNotes | Where-Object { $_.version -eq $version }) | Select-Object -First 1
          $notes = @($own.notes | ForEach-Object { "- $_" }) -join "`n"
          if (-not $notes) { $notes = "Version $version." }
          gh release create $tag $zip --target $env:GITHUB_SHA --title "SmoothMice module $version" --notes $notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag." }
      - uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: artifacts/module/*.zip
          if-no-files-found: error
